<style>

/* GENERAL */

body {

  margin: 0;

  font-family: 'Open Sans', sans-serif;

  color: white;

}

/* GOLD TEXT */

.gold-text {

  background: linear-gradient(45deg, #b8962e, #d4af37, #fff3b0, #d4af37, #b8962e);

  -webkit-background-clip: text;

  -webkit-text-fill-color: transparent;

}

/* VIDEO BACKGROUND */

.video-bg {

  position: fixed;

  top: 0;

  left: 0;

  width: 100%;

  height: 100%;

  object-fit: cover;

  z-index: -2;

}

.overlay {

  position: fixed;

  width: 100%;

  height: 100%;

  background: rgba(30, 0, 0, 0.35);

  z-index: -1;

}

/* HEADER */

.header {

  display: flex;

  align-items: center;

  gap: 40px;

  padding: 20px;

  position: sticky;

  top: 0;

  background: rgba(60, 0, 0, 0.7);

  backdrop-filter: blur(6px);

}

.logo img {

  width: 80px;

  border-radius: 50%;

}

.menu {

  display: flex;

  flex-wrap: wrap;

  align-items: center;

}

.menu a {

  margin-right: 20px;

  color: gold;

  text-decoration: none;

}

.consult-btn {

  padding: 10px 22px;

  border: 2px solid gold;

  border-radius: 30px;

  color: gold;

  text-decoration: none;

  font-weight: bold;

}

/* PAGE TITLE */

.page-title {

  text-align: center;

  padding: 40px 20px 10px;

}

.page-title h1 {

  font-size: 42px;

  margin: 0;

}

/* BROW SECTIONS */

.brow-section {

  text-align: center;

  margin: 60px 0;

}

.brow-section h3 {

  margin-bottom: 20px;

  font-size: 22px;

}

.brow-image {

  width: 80%;

  max-width: 900px;

  border-radius: 20px;

  display: block;

  margin: 0 auto;

}

/* MOBILE FIX */

@media (max-width: 768px) {

  .header {

    flex-direction: column;

    align-items: center;

    gap: 10px;

  }

  .menu {

    justify-content: center;

  }

  .menu a {

    font-size: 14px;

    margin: 5px;

  }

  .consult-btn {

    padding: 8px 16px;

    font-size: 14px;

  }

  .page-title h1 {

    font-size: 28px;

  }

  .brow-image {

    width: 92%;

  }

  .brow-section h3 {

    font-size: 18px;

  }

}

</style>
