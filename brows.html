<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brows | Pigmentica</title>

<style>

/* FLOATING IMAGE FIX */
.hero-image {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 160px;
  z-index: 999;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
}

/* MOBILE FIX */
@media (max-width: 768px) {
  .hero-image {
     position: fixed;
     top: 10px;
     right: 10px;
     width: 100px;
  }
}

/* BACKGROUND */
.video-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(30, 0, 0, 0.65);
  z-index: -1;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  color: white;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  gap: 40px;
  padding: 20px;
  position: sticky;
  top: 0;
  background: rgba(60, 0, 0, 0.85);
  backdrop-filter: blur(6px);
  z-index: 5;
}

.logo img {
  width: 80px;
  border-radius: 50%;
}

.menu a {
  margin-right: 20px;
  color: gold;
  text-decoration: none;
}

/* HERO */
.hero-wrapper {
  text-align: center;
  padding: 100px 20px 60px;
}

.hero-text h1 {
  font-size: 48px;
  letter-spacing: 4px;
  color: gold;
}

.hero-text p {
  font-family: 'Nothing You Could Do', cursive;
  font-size: 32px;
  color: #f5e6c8;
}

</style>
</head>

<body>

<video autoplay muted loop playsinline class="video-bg">
  <source src="background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="header">
  <div class="logo">
      <img src="logo.png">
  </div>

  <div class="menu">
      <a href="index.html#about">About</a>
      <a href="index.html#treatments">Treatments</a>
      <a href="index.html#prices">Prices</a>
      <a href="index.html#contact">Contact</a>
  </div>
</div>

<img src="brows.jpg" class="hero-image">

<div class="hero-wrapper">
  <div class="hero-text">
     <h1>BROWS</h1>
     <p>Natural. Defined. Beautiful.</p>
  </div>
</div>

</body>
</html>
