<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brows | Pigmentica</title>

<style>

/* FLOATING IMAGE FIX */
.hero-image {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 160px;
  z-index: 999;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
}

/* MOBILE FIX */
@media (max-width: 768px) {
  .hero-image {
     position: fixed;
     top: 10px;
     right: 10px;
     width: 100px;
  }
}

/* BACKGROUND */
.video-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(30, 0, 0, 0.65);
  z-index: -1;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  color: white;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  gap: 40px;
  padding: 20px;
  position: sticky;
  top: 0;
  background: rgba(60, 0, 0, 0.85);
  backdrop-filter: blur(6px);
  z-index: 5;
}

.logo img {
  width: 80px;
  border-radius: 50%;
}

.menu a {
  margin-right: 20px;
  color: gold;
  text-decoration: none;
}

<!-- HERO -->

</div>

</html>
