<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brows | Pigmentica</title>

<style>

/* FLOATING IMAGE */
.hero-image {
 position: fixed;
 top: 20px;
 right: 20px;
 width: 160px;
 z-index: 999;
 border-radius: 20px;
}

/* BACKGROUND */
.video-bg {
 position: fixed;
 width: 100%;
 height: 100%;
 object-fit: cover;
 z-index: -2;
}

.overlay {
 position: fixed;
 width: 100%;
 height: 100%;
 background: rgba(30,0,0,0.65);
 z-index: -1;
}

body {
 margin: 0;
 font-family: Georgia;
 color: white;
}

/* HEADER */
.header {
 display: flex;
 gap: 40px;
 padding: 20px;
 position: sticky;
 top: 0;
 background: rgba(60,0,0,0.85);
}

.menu a {
 color: gold;
 margin-right: 20px;
}

/* HERO */
.hero-wrapper {

   text-align: center;

   padding: 40px 20px 20px; /* was 100px — now tighter */

}

.hero-text h1 {

   font-size: 48px;

   letter-spacing: 4px;

   color: gold;

   margin-bottom: 5px; /* 👈 ADD THIS */

}

.hero-text p {

   font-family: 'Nothing You Could Do', cursive;

   font-size: 32px;

   color: #f5e6c8;

   margin-top: 0; /* 👈 ADD THIS */

}

/* TREATMENTS */
.section {
 text-align: center;
}

.brow-grid {
 display: flex;
 flex-wrap: wrap;
 justify-content: center;
 gap: 30px;
}

.brow-card {
 width: 250px;
}

.brow-card img {
 width: 100%;
}

</style>
</head>

<body>

<video autoplay muted loop class="video-bg">
<source src="background.mp4">
</video>

<div class="overlay"></div>

<div class="header">
<div class="menu">
<a href="index.html">Home</a>
</div>
</div>

<img src="brows.jpg" class="hero-image">

<div class="hero-wrapper">
<div class="hero-text">
<h1>BROWS</h1>
<p>Natural. Defined. Beautiful.</p>
</div>
</div>

<div class="section">

<div class="brow-grid">

<div class="brow-card">
<img src="powder.jpg">
<h3>Powder Brows</h3>
</div>

<div class="brow-card">
<img src="nano.jpg">
<h3>Nano Brows</h3>
</div>

<div class="brow-card">
<img src="hyper.jpg">
<h3>Hyper Realism Brows</h3>
</div>

<div class="brow-card">
<img src="removal.jpg">
<h3>Removal (Hanafy)</h3>
</div>

</div>
</div>

</body>
</html>
