<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pigmentica</title>

<style>

/* BASE */
body {
   margin: 0;
   font-family: 'Georgia', serif;
   color: white;
   background: #1a0000;
   scroll-behavior: smooth;
}

/* MENU */
.menu {
   position: fixed;
   top: 20px;
   left: 20px;
   z-index: 5;
}

.menu a {
   display: block;
   margin: 10px 0;
   color: gold;
   text-decoration: none;
   font-size: 14px;
   letter-spacing: 1px;
}

/* HERO */
.hero {
   position: relative;
   height: 100vh;
   overflow: hidden;
}

.bg-video {
   position: absolute;
   top: 50%;
   left: 50%;
   width: 120%;
   height: 120%;
   object-fit: cover;
   transform: translate(-50%, -50%);
   z-index: 0;
}

.hero::after {
   content: "";
   position: absolute;
   inset: 0;
   background: rgba(30, 0, 0, 0.55);
   z-index: 1;
}

.hero-content {
   position: relative;
   z-index: 2;
   text-align: center;
   top: 50%;
   transform: translateY(-50%);
}

.hero h1 {
   font-size: 52px;
   letter-spacing: 5px;
   color: gold;
}

/* SECTIONS */
.section {
   padding: 80px 20px;
   text-align: center;
   background: #1a0000;
}

.section h2 {
   color: gold;
}

.section p {
   max-width: 500px;
   margin: auto;
   opacity: 0.85;
}

/* BUTTON */
.button {
   margin-top: 20px;
   padding: 12px 25px;
   background: gold;
   color: black;
   border-radius: 30px;
   text-decoration: none;
}

</style>
</head>

<body>

<div class="menu">
 <a href="#about">About</a>
 <a href="#treatments">Treatments</a>
 <a href="#prices">Prices</a>
 <a href="#contact">Contact</a>
</div>

<div class="hero">
 <video autoplay muted loop playsinline class="bg-video">
   <source src="background.mp4" type="video/mp4">
 </video>

 <div class="hero-content">
   <h1>PIGMENTICA</h1>
 </div>
</div>

<div class="section" id="about">
 <h2>About</h2>
 <p>Enhancing natural beauty through expert semi-permanent makeup treatments tailored to you.</p>
</div>

<div class="section" id="treatments">
 <h2>Treatments</h2>
 <p>Brows • Lips • Eyeliner</p>
</div>

<div class="section" id="prices">
 <h2>Prices</h2>
 <p>Contact us for full pricing.</p>
</div>

<div class="section" id="contact">
 <h2>Contact</h2>
 <p>📞 0755 001 2000</p>
 <a class="button" href="https://wa.me/447550012000">Book Now</a>
</div>

</body>
</html>
