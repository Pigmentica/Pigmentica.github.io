<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pigmentica</title>

<!-- TESLA-STYLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>

/* BASE */
body {
   margin: 0;
   font-family: 'Georgia', serif;
   color: white;
   background: radial-gradient(circle at top, #6a0d0d, #1a0000);
   scroll-behavior: smooth;
}

/* ✨ TESLA-STYLE METALLIC GOLD TEXT */
.tesla-gold {
   font-family: 'Orbitron', sans-serif;
   letter-spacing: 8px;
   font-size: 48px;
   text-transform: uppercase;

   background: linear-gradient(
       90deg,
       #caa44a,
       #ffd700,
       #fff2b0,
       #ffd700,
       #caa44a
   );
   -webkit-background-clip: text;
   -webkit-text-fill-color: transparent;
   background-size: 200% auto;
   animation: goldShine 4s linear infinite;

   text-shadow:
       0 0 5px rgba(255,215,0,0.3),
       0 0 10px rgba(255,215,0,0.4),
       0 0 20px rgba(255,215,0,0.5);
}

@keyframes goldShine {
   0% { background-position: 0% center; }
   100% { background-position: 200% center; }
}

/* BACKGROUND DUST */
body::before {
   content: "";
   position: fixed;
   width: 200%;
   height: 200%;
   top: -50%;
   left: -50%;
   background: radial-gradient(circle, rgba(255,215,0,0.15) 2px, transparent 3px);
   background-size: 250px 250px;
   animation: floatDust 35s linear infinite;
   z-index: 0;
   pointer-events: none;
}

@keyframes floatDust {
   0% { transform: translate(0,0); }
   100% { transform: translate(200px,200px); }
}

/* MENU */
.menu {
   position: fixed;
   top: 20px;
   left: 20px;
   z-index: 3;
}

.menu a {
   display: block;
   margin: 10px 0;
   text-decoration: none;
}

/* HERO */
.hero {
   height: 90vh;
   display: flex;
   align-items: center;
   justify-content: center;
   position: relative;
   z-index: 2;
}

/* SECTIONS */
.section {
   padding: 80px 20px;
   text-align: center;
   position: relative;
   z-index: 2;
}

.button {
   margin-top: 20px;
   padding: 12px 25px;
   background: gold;
   color: black;
   border-radius: 30px;
   text-decoration: none;
}

</style>
</head>

<body>

<div class="menu">
 <a href="#about" class="tesla-gold">About</a>
 <a href="#treatments" class="tesla-gold">Treatments</a>
 <a href="#prices" class="tesla-gold">Prices</a>
 <a href="#contact" class="tesla-gold">Contact</a>
</div>

<div class="hero">
 <h1 class="tesla-gold">PIGMENTICA</h1>
</div>

<div class="section" id="about">
 <h2 class="tesla-gold">About</h2>
 <p>Enhancing natural beauty through expert semi-permanent makeup.</p>
</div>

<div class="section" id="treatments">
 <h2 class="tesla-gold">Treatments</h2>
 <p>Brows • Lips • Eyeliner</p>
</div>

<div class="section" id="prices">
 <h2 class="tesla-gold">Prices</h2>
 <p>Brows £250 | Lips £220 | Eyeliner £180</p>
</div>

<div class="section" id="contact">
 <h2 class="tesla-gold">Contact</h2>
 <p>0755 001 2000</p>
 <a class="button" href="https://wa.me/447550012000">Book Now</a>
</div>

</body>
</html>
