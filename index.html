<style>

/* BACKGROUND */
body {
   margin:0;
   font-family: Georgia, serif;
   color:white;
   background: linear-gradient(135deg,#5a0c0c,#2b0000);
}

/* GOLD DUST */
body::before {
   content:"";
   position:fixed;
   width:200%;
   height:200%;
   top:-50%;
   left:-50%;
   background:
   radial-gradient(circle, rgba(255,215,0,0.15) 2px, transparent 3px);
   background-size:300px 300px;
   animation: move 40s linear infinite;
}

@keyframes move {
   from {transform:translate(0,0);}
   to {transform:translate(200px,200px);}
}

/* MENU */
.menu {
   position:fixed;
   top:20px;
   left:20px;
}

.menu a {
   display:block;
   color:gold;
   text-decoration:none;
   margin:8px 0;
}

/* HERO */

   height:80vh;
   display:flex;
   align-items:center;
   justify-content:center;
}

.hero h1 {
   font-size:50px;
}

/* CONTACT */
.contact-section {
   background:#7a0c0c;
   padding:60px 20px;
   text-align:center;
}

.contact-item {
   display:block;
   margin:10px auto;
   padding:10px;
   border:1px solid gold;
   border-radius:25px;
   max-width:250px;
   color:white;
   text-decoration:none;
}

</style>
