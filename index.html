<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pigmentica</title>
<style>

/* BASE */

body {

    margin: 0;

    font-family: 'Georgia', serif;

    color: white;

    background: linear-gradient(135deg, #4b0b0b, #1a0000);

    scroll-behavior: smooth;

}

/* ✨ DUST BACKGROUND */

body::before {

    content: "";

    position: fixed;

    width: 200%;

    height: 200%;

    top: -50%;

    left: -50%;

    background-image: radial-gradient(rgba(255,215,0,0.12) 2px, transparent 2px);

    background-size: 60px 60px;

    animation: dustMove 20s linear infinite;

    z-index: 1;

    pointer-events: none;

}

@keyframes dustMove {

    0% { transform: translate(0,0); }

    100% { transform: translate(300px,300px); }

}

@keyframes dust {

    from { transform: translate(0,0); }

    to { transform: translate(200px,200px); }

}

/* MENU */

.menu {

    position: fixed;

    top: 20px;

    left: 20px;

    z-index: 10;

}

.menu a {

    display: block;

    margin: 10px 0;

    color: gold;

    text-decoration: none;

    font-size: 14px;

    letter-spacing: 1px;

}

.menu a:hover {

    opacity: 0.7;

}

/* HERO */

.hero {

    height: 90vh;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

}

.hero h1 {

    font-size: 48px;

    letter-spacing: 4px;

}

/* SECTIONS */

.section {

    padding: 80px 20px;

    text-align: center;

}

.section h2 {

    color: gold;

    margin-bottom: 20px;

}

.section p {

    max-width: 500px;

    margin: auto;

    opacity: 0.85;

}

/* TREATMENTS */

.treatments {

    display: flex;

    overflow-x: auto;

    gap: 20px;

    padding: 20px;

}

.card {

    min-width: 250px;

    height: 320px;

    border-radius: 20px;

    overflow: hidden;

    position: relative;

}

.card img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}

.card span {

    position: absolute;

    bottom: 20px;

    left: 20px;

    color: white;

    font-size: 20px;

    letter-spacing: 2px;

}

/* BUTTON */

.button {

    margin-top: 30px;

    padding: 12px 25px;

    background: gold;

    color: black;

    border-radius: 30px;

    text-decoration: none;

    display: inline-block;

}

</style>
</head>
<body>
    <!-- MENU -->
  <div class="menu">

  <a href="#about">About</a>

  <a href="#treatments">Treatments</a>

  <a href="#prices">Prices</a>

  <a href="#contact">Contact</a>

</div
    <!-- HERO -->
    <div class="hero">

  <h1>PIGMENTICA</h1>

</div>
<!-- ABOUT -->
    <div class="section" id="about">

  <h2>About</h2>

  <p>Enhancing natural beauty through expert semi-permanent makeup treatments tailored to you.</p>

</div>
<!-- TREATMENTS -->
    <div class="section" id="treatments">

  <h2>Treatments</h2>
    <div class="treatments">

    <div class="card">

      <img src="brows.jpg">

      <span>BROWS</span>

    </div>
    <div class="card">

  <img src="lips.jpg">

  <span>LIPS</span>

</div>

<div class="card">

  <img src="eyes.jpg">

  <span>EYES</span>

</div>
  </div>
  </div>
  <!-- PRICES -->
    <div class="section" id="prices">

  <h2>Prices</h2>

  <p>Contact us for a full price list or consultation.</p>

</div>
<!-- CONTACT -->
    <div class="section" id="contact">

  <h2>Contact Us</h2>

  <p>📞 0755 001 2000</p>

  <a class="button" href="https://wa.me/447550012000">Book Now</a>

</div>
</body>

</html>
