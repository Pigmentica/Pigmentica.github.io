<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pigmentica</title>

<style>

body {

    margin: 0;

    font-family: 'Georgia', serif;

    color: white;

    background: linear-gradient(135deg, #5a0c0c, #2b0000);

    overflow-x: hidden;

}

/* ✨ MOVING BURGUNDY DUST */

body::before {

    content: "";

    position: fixed;

    width: 200%;

    height: 200%;

    top: -50%;

    left: -50%;

    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);

    background-size: 40px 40px;

    animation: moveDust 60s linear infinite;

    z-index: 0;

}

@keyframes moveDust {

    from { transform: translate(0,0); }

    to { transform: translate(200px,200px); }

}

/* HERO IMAGE */

.hero {

    width: 100%;

    height: 60vh;

    background: url('banner.jpg') center/cover no-repeat;

}

/* LOGO */

.logo {

    text-align: center;

    margin-top: -100px;

    position: relative;

    z-index: 2;

}

.logo img {

    width: 220px;

    border-radius: 50%;

    border: 4px solid rgba(255,255,255,0.6);

    box-shadow: 0 10px 30px rgba(0,0,0,0.4);

}

/* CONTENT */

.content {

    text-align: center;

    padding: 40px 20px;

    position: relative;

    z-index: 2;

}

h1 {

    font-size: 42px;

    letter-spacing: 3px;

    margin-bottom: 10px;

}

.tagline {

    font-size: 18px;

    opacity: 0.85;

    margin-bottom: 20px;

}

.desc {

    font-size: 16px;

    max-width: 500px;

    margin: auto;

    opacity: 0.8;

}

/* BUTTON */

.button {

    display: inline-block;

    margin-top: 30px;

    padding: 14px 30px;

    background: #a31515;

    color: white;

    text-decoration: none;

    border-radius: 30px;

    font-size: 15px;

    transition: 0.3s;

}

.button:hover {

    background: #d12a2a;

    transform: translateY(-2px);

}

</style>

</head>

<body>

<div class="hero"></div>

<div class="logo">

    <img src="logo.png" alt="Pigmentica Logo">

</div>

<div class="content">

    <h1>PIGMENTICA</h1>

    <div class="tagline">Semi-Permanent Makeup</div>

    <div class="desc">

        Enhancing natural beauty. Empowering confidence.

    </div>

    <a class="button" href="https://wa.me/447550012000">

        Book Appointment

    </a>

</div>

</body>

</html>
