<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pigmentica</title>

<style>

/* BASE */
body {
   margin: 0;
   font-family: 'Helvetica Neue', Arial, sans-serif;
   color: white;
   scroll-behavior: smooth;
}

/* VIDEO BACKGROUND */
.bg-video {
   position: fixed;
   top: 50%;
   left: 50%;
   min-width: 100%;
   min-height: 100%;
   transform: translate(-50%, -50%);
   object-fit: cover;
   z-index: -1;
   filter: brightness(0.35);
}

/* LOGO TOP RIGHT */
.logo-top {
   position: fixed;
   top: 20px;
   right: 20px;
   z-index: 5;
}

.logo-top img {
   width: 90px;
   border-radius: 50%;
   border: 2px solid rgba(255,215,0,0.6);
}

/* MENU LEFT */
.menu {
   position: fixed;
   top: 20px;
   left: 20px;
   z-index: 5;
}

.menu a {
   display: block;
   margin: 8px 0;
   color: gold;
   text-decoration: none;
   font-size: 13px;
   letter-spacing: 2px;
}

/* HERO */
.hero {
   height: 90vh;
   display: flex;
   flex-direction: column;
   justify-content: center;
   align-items: center;
}

/* BRAND TITLE */
.brand {
   font-size: 56px;
   letter-spacing: 8px;
   font-weight: 500;
   color: gold;
   text-transform: uppercase;
}

/* SUBTEXT */
.tagline {
   margin-top: 10px;
   font-size: 18px;
   opacity: 0.85;
}

/* BUTTON */
.button {
   margin-top: 30px;
   padding: 14px 30px;
   background: gold;
   color: black;
   border-radius: 30px;
   text-decoration: none;
   font-size: 14px;
   letter-spacing: 1px;
}

/* SECTIONS */
.section {
   padding: 80px 20px;
   text-align: center;
}

.section h2 {
   color: gold;
   margin-bottom: 20px;
}

</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop playsinline class="bg-video">
 <source src="background.mp4" type="video/mp4">
</video>

<!-- LOGO -->
<div class="logo-top">
 <img src="logo.png" alt="Pigmentica Logo">
</div>

<!-- MENU -->
<div class="menu">
 <a href="#about">ABOUT</a>
 <a href="#treatments">TREATMENTS</a>
 <a href="#prices">PRICES</a>
 <a href="#contact">CONTACT</a>
</div>

<!-- HERO -->
<div class="hero">
 <div class="brand">PIGMENTICA</div>
 <div class="tagline">Semi-Permanent Makeup</div>
 <a class="button" href="https://wa.me/447550012000">BOOK APPOINTMENT</a>
</div>

<!-- ABOUT -->
<div class="section" id="about">
 <h2>About</h2>
 <p>Enhancing natural beauty through expert semi-permanent makeup treatments tailored to you.</p>
</div>

<!-- TREATMENTS -->
<div class="section" id="treatments">
 <h2>Treatments</h2>
 <p>Brows • Lips • Eyeliner</p>
</div>

<!-- PRICES -->
<div class="section" id="prices">
 <h2>Prices</h2>
 <p>Contact for full price list.</p>
</div>

<!-- CONTACT -->
<div class="section" id="contact">
 <h2>Contact</h2>
 <p>0755 001 2000</p>
</div>

</body>
</html>
