body {

    margin: 0;

    color: white;

    overflow-x: hidden;

}

/* ✨ MOVING BURGUNDY DUST */

body::before {

    content: "";

    position: fixed;

    width: 200%;

    height: 200%;

    top: -50%;

    left: -50%;

    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);

    background-size: 40px 40px;

    animation: moveDust 60s linear infinite;

    z-index: 0;

}

@keyframes moveDust {

    from { transform: translate(0,0); }

    to { transform: translate(200px,200px); }

}

/* HERO IMAGE */

.hero {

  height: 50vh;

  background: url('banner.jpg') center/contain no-repeat;

  background-color: #f5eee9;

}

/* LOGO */

.logo {

    text-align: center;

    margin-top: -100px;

    position: relative;

    z-index: 2;

}

.logo img {

    width: 220px;

    border-radius: 50%;

    border: 4px solid rgba(255,255,255,0.6);

    box-shadow: 0 10px 30px rgba(0,0,0,0.4);

}

/* CONTENT */

.content {

    text-align: center;

    padding: 40px 20px;

    position: relative;

    z-index: 2;

}

h1 {

    font-size: 42px;

    letter-spacing: 3px;

}

.tagline {

}

.desc {

    opacity: 0.8;

}

/* BUTTON */

.button {

    display: inline-block;

    margin-top: 30px;

    padding: 14px 30px;

    background: #a31515;

    color: white;

    text-decoration: none;

    border-radius: 30px;

    font-size: 15px;

    transition: 0.3s;

}

.button:hover {

    background: #d12a2a;

    transform: translateY(-2px);

}
