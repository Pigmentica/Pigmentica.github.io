<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pigmentica</title>

<style>

/* BASE */
body {
   margin: 0;
   font-family: 'Georgia', serif;
   color: white;
   scroll-behavior: smooth;
}

/* 🎥 FULL PAGE VIDEO BACKGROUND */
.bg-video {
   position: fixed;
   top: 50%;
   left: 50%;
   min-width: 100%;
   min-height: 100%;
   width: auto;
   height: auto;
   transform: translate(-50%, -50%);
   object-fit: cover;
   z-index: -1;
   filter: brightness(0.35) contrast(1.1);
}

/* CONTENT ABOVE VIDEO */
.menu, .hero, .section {
   position: relative;
   z-index: 2;
}

/* METALLIC GOLD TEXT */
.gold-text {
   background: linear-gradient(
       90deg,
       #caa44a,
       #ffd700,
       #fff2b0,
       #ffd700,
       #caa44a
   );
   -webkit-background-clip: text;
   -webkit-text-fill-color: transparent;
   background-size: 200% auto;
   animation: goldShine 4s linear infinite;

   text-shadow:
       0 0 5px rgba(255,215,0,0.3),
       0 0 10px rgba(255,215,0,0.4),
       0 0 20px rgba(255,215,0,0.5);
}

@keyframes goldShine {
   0% { background-position: 0% center; }
   100% { background-position: 200% center; }
}

/* MENU */
.menu {
   position: fixed;
   top: 20px;
   left: 20px;
   z-index: 3;
}

.menu a {
   display: block;
   margin: 10px 0;
   text-decoration: none;
}

/* HERO */
.hero {
   height: 90vh;
   display: flex;
   align-items: center;
   justify-content: center;
   text-align: center;
}

/* SECTIONS */
.section {
   padding: 80px 20px;
   text-align: center;
}

.section p {
   max-width: 500px;
   margin: auto;
   opacity: 0.9;
}

/* BUTTON */
.button {
   margin-top: 20px;
   padding: 12px 25px;
   background: gold;
   color: black;
   border-radius: 30px;
   text-decoration: none;
}

</style>
</head>

<body>

<!-- GLOBAL VIDEO BACKGROUND -->
<video autoplay muted loop playsinline class="bg-video">
 <source src="background.mp4" type="video/mp4">
</video>

<!-- MENU -->
<div class="menu">
 <a href="#about" class="gold-text">About</a>
 <a href="#treatments" class="gold-text">Treatments</a>
 <a href="#prices" class="gold-text">Prices</a>
 <a href="#contact" class="gold-text">Contact</a>
</div>

<!-- HERO -->
<div class="hero">
 <h1 class="gold-text">PIGMENTICA</h1>
</div>

<!-- ABOUT -->
<div class="section" id="about">
 <h2 class="gold-text">About</h2>
 <p>Enhancing natural beauty through expert semi-permanent makeup.</p>
</div>

<!-- TREATMENTS -->
<div class="section" id="treatments">
 <h2 class="gold-text">Treatments</h2>
 <p>Brows • Lips • Eyeliner</p>
</div>

<!-- PRICES -->
<div class="section" id="prices">
 <h2 class="gold-text">Prices</h2>
 <p>Brows £250 | Lips £220 | Eyeliner £180</p>
</div>

<!-- CONTACT -->
<div class="section" id="contact">
 <h2 class="gold-text">Contact</h2>
 <p>0755 001 2000</p>
 <a class="button" href="https://wa.me/447550012000">Book Now</a>
</div>

</body>
</html>
